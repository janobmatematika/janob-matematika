workflows:
  android-workflow:
    name: Janob Matematika Android Build
    max_build_duration: 30
    environment:
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Fix permissions
        script: chmod -R +x node_modules/.bin
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build Android Debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk